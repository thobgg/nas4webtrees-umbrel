version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: thobgg-nas4webtrees_web_1
      APP_PORT: 80
      # Die Apps wtWin, wtTux und wtAnd sprechen die Schnittstelle direkt an – ohne Umbrel-Anmeldung.
      # webtrees hat seine eigene Anmeldung.
      PROXY_AUTH_ADD: "false"

  web:
    image: ghcr.io/thobgg/nas4webtrees:2.2.6-9
    restart: on-failure
    environment:
      PUID: "1000"
      PGID: "1000"
    volumes:
      - ${APP_DATA_DIR}/data/webtrees:/webtrees
      - ${APP_DATA_DIR}/data/backup:/backup
